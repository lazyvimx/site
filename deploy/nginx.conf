# nginx внутри контейнера lazyvimx-site. TLS, сжатие и домен держит общий Caddy,
# сюда запросы приходят по сети edge уже расшифрованными.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # За прокси абсолютный редирект ушёл бы на http://lazyvimx-site, отдаём относительный.
    absolute_redirect off;
    error_page 404 /404.html;

    # Хэшированные ассеты VitePress неизменяемы, кешируем навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # cleanUrls: ссылки ведут на /extras, а на диске лежит extras.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
