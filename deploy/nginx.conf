# nginx внутри контейнера lazyvimx-site. TLS, сжатие и домен -- на общем Caddy,
# запросы приходят сюда через сеть `edge` уже расшифрованными.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # За прокси абсолютный редирект вёл бы на http://lazyvimx-site,
    # поэтому отдаём относительный.
    absolute_redirect off;
    error_page 404 /404.html;

    # Ассеты Astro с хешем в имени никогда не меняются, поэтому кешируем их навсегда.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # У фрагментов индекса имена с хешем, но точка входа pagefind.js -- без,
    # и после новой сборки она должна приехать свежей.
    location /pagefind/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # На VitePress карта сайта лежала одним файлом, Astro делит её на индекс и части.
    location = /sitemap.xml {
        return 301 /sitemap-index.xml;
    }

    # Страницы лежат файлами `extras.html`, а открываются по `/extras`, как на VitePress.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
